[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
# YAML-formatted output without a collection dependency. The old
# community.general.yaml callback plugin was removed in
# community.general 12.0.0 (superseded by this ansible-core-native
# option), which is what caused "plugin yaml was not installed" - a
# fresh `ansible-galaxy collection install` pulls whatever the latest
# community.general is, which no longer ships it. `default` +
# callback_result_format is bundled with ansible-core (2.13+) and needs
# nothing extra installed.
stdout_callback = default
callback_result_format = yaml
timeout = 30

[ssh_connection]
pipelining = True
